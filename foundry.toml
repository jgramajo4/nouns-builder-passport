[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"
solc    = "0.8.19"

# Optimise for deployment
optimizer        = true
optimizer_runs   = 200
via_ir           = false

# Remappings for EAS contracts and OpenZeppelin
remappings = [
    "@ethereum-attestation-service/eas-contracts/=lib/eas-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "enscribe/=lib/enscribe/src/"
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
mainnet = "${MAINNET_RPC}"
sepolia = "${SEPOLIA_RPC}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
