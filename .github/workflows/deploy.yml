name: Deploy to IPFS via Omnipin

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID:   ${{ secrets.VITE_WC_PROJECT_ID }}
          VITE_RPC_URL:         ${{ secrets.VITE_RPC_URL }}
          VITE_SCHEMA_1_UID:    ${{ secrets.VITE_SCHEMA_1_UID }}
          VITE_SCHEMA_2_UID:    ${{ secrets.VITE_SCHEMA_2_UID }}
          VITE_SCHEMA_3_UID:    ${{ secrets.VITE_SCHEMA_3_UID }}
          VITE_NOUNS_PASSPORT_RESOLVER: ${{ secrets.VITE_NOUNS_PASSPORT_RESOLVER }}
          VITE_NOUN_HOLDER_RESOLVER:    ${{ secrets.VITE_NOUN_HOLDER_RESOLVER }}

      - name: Install Omnipin
        run: npm install -g omnipin

      - name: Deploy to IPFS + update ENS
        run: omnipin publish nouns-passport.eth ./dist
        env:
          OMNIPIN_PRIVATE_KEY: ${{ secrets.OMNIPIN_PRIVATE_KEY }}
          # OMNIPIN_SAFE_ADDRESS: ${{ secrets.OMNIPIN_SAFE_ADDRESS }}  # optional: use Safe multisig
